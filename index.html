<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AO3 HTML to Epub</title>
  <link rel="stylesheet" href="/src/style.css"/>
</head>

<body>
  <div id="app">
    <main>
      <h1 class="text-center my-7">AO3 HTML to Epub</h1>
      <div id="container">
        <div class="epub rounded shadow-lg border p-4 border-base-content/30" id="epub-container">
          <div class="items-center justify-center flex" id="cover">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-file-image preview-icon">
              <path
                d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
              <path d="M14 2v5a1 1 0 0 0 1 1h5" />
              <circle cx="10" cy="12" r="2" />
              <path d="m20 17-1.296-1.296a2.41 2.41 0 0 0-3.408 0L9 22" />
            </svg>
          </div>
          <div id="epub-details">
            <h3></h3>
            <p id="author" class="text-sm text-base-content/50"></p>
            <p id="summary" class="p-1.5 rounded-lg mt-2 bg-base-200"></p>
            <button name="convert" form="epub-opts" class="btn btn-soft" id="convert">Convert</button>
          </div>

        </div>
        <footer class="epub">

          <form id="epub-opts" class="mt-2 border border-base-content/30 p-2 border-dashed rounded">
            <div class="join w-full mt-2">
              <button id="reset-epub" type="button" title="go back" class="btn btn-square join-item"><svg
                  xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-undo-2 preview-icon">
                  <path d="M9 14 4 9l5-5" />
                  <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" />
                </svg></button>
              <input name="img-url" class="input join-item w-full" type="url" placeholder="Paste image or image url" />
              <input class="file-input join-item" type="file" accept="image/*" />
            </div>
            <label class="label text-sm mt-4">
              <input type="checkbox" class="checkbox" id="toggle-keypubify" name="toggle-kepub" />
              Kepubify
            </label>
            <fieldset disabled class="fieldset">

            </fieldset>
          </form>
        </footer>
        <form class="card" id="epub-dropzone">
          <label class="card-body items-center border rounded border-dashed border-base-content/50">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-file-code-corner preview-icon pointer-events-none">
              <path
                d="M4 12.15V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2h-3.35" />
              <path d="M14 2v5a1 1 0 0 0 1 1h5" />
              <path d="m5 16-3 3 3 3" />
              <path d="m9 22 3-3-3-3" />
            </svg>
            <input name="html" type="file" id="html-input" accept="html" class="file-input my-1" />
          </label>
        </form>
      </div>

      <div id="message" class="alert-soft alert"></div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
